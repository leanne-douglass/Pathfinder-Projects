<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Join Us • Pathfinder</title>
  <link href="https://fonts.googleapis.com/css2?family=Elms+Sans:wght@100..900&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <header class="topbar" aria-label="Top Navigation">
    <nav aria-label="Primary">
      <ul class="nav__list">
        <li class="nav__item"><a href="index.html" class="nav__link">Home</a></li>
        <li class="nav__item"><a href="projects.html" class="nav__link">Projects</a></li>
        <li class="nav__item"><a href="aboutus.html" class="nav__link">About us</a></li>
        <li class="nav__item"><a href="contactus.html" class="nav__link">Contact us</a></li>
        <li class="nav__item"><a href="signup.html" class="nav__link" aria-current="page">Join us</a></li>
      </ul>
      <a href="signin.html" class="nav_member">Already a Member? Sign in</a>
    </nav>
  </header>

  <main class="main-pad">
    <section class="hero-content hero-content--center">
      <h3 class="hero-subtitle">Do you want to work with us?</h3>
      <h1 class="hero-title">Register now</h1>
      <p class="hero-description">
        At Pathfinder Projects, we specialise in turning ideas into outcomes…
      </p>
    </section>

    <section aria-labelledby="signup-title" class="form-section">
      <h2 id="signup-title" class="visually-hidden">Registration form</h2>

      <form class="form" action="#" method="post" novalidate>
        <!-- why: keep labels clickable + required a11y -->
        <div class="form-row">
          <label for="email">Email<span aria-hidden="true">*</span></label>
          <input id="email" name="email" type="email" autocomplete="email" required placeholder="you@domain.com"/>
        </div>

        <div class="form-row">
          <label for="fullName">Full name<span aria-hidden="true">*</span></label>
          <input id="fullName" name="fullName" type="text" autocomplete="name" required placeholder="Jane Doe"/>
        </div>

        <div class="form-row">
          <label for="password">Password<span aria-hidden="true">*</span></label>
          <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required placeholder="Minimum 8 characters"/>
        </div>

        <div class="form-row">
          <label for="company name">Company Name/Project Name*</label>
          <input id="company name" name="companyname" type="companyname"/>
        </div>

        <div class="form-row">
          <label for="terms">
            <input id="terms" name="terms" type="checkbox" required/>
            I agree to the Terms
          </label>
        </div>

        <div class="form-actions">
          <button type="submit" class="slide-button">Create account</button>
        </div>
      </form>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
